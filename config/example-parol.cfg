# PAROL6 joint-space configuration for kinematics: parol
#
# X, Y, Z, A, B and C are J1, J2, J3, J4, J5 and J6 respectively.
# All six coordinates and all limits below are DEGREES, not millimetres.
# This is a template: replace every pin and every position_endstop with values
# measured on THIS robot before powering motors. Confirm direction at very low
# speed, with an accessible E-stop, before attempting G28. J1/J2/J3 home
# simultaneously, so give those three rails identical homing_speed,
# homing_retract_dist, homing_retract_speed, and second_homing_speed settings.
#
# G1 X0 Y-90 Z180 A0 B0 C180 is the documented standby pose.

[stepper_x] # J1: 6.4:1 reduction -> 56.25 joint degrees / motor revolution
step_pin: <J1_STEP_PIN>
dir_pin: <J1_DIR_PIN>             # Prefix ! if the documented J1 sign is wrong
enable_pin: <J1_ENABLE_PIN>
microsteps: 32
full_steps_per_rotation: 200
rotation_distance: 56.25
endstop_pin: <J1_ENDSTOP_PIN>
position_endstop: <MEASURED_J1_ENDSTOP_DEGREES>
position_min: -123.046875
position_max: 123.046875

[stepper_y] # J2: 20:1 -> 18 degrees / motor revolution
step_pin: <J2_STEP_PIN>
dir_pin: <J2_DIR_PIN>
enable_pin: <J2_ENABLE_PIN>
microsteps: 32
full_steps_per_rotation: 200
rotation_distance: 18
endstop_pin: <J2_ENDSTOP_PIN>
position_endstop: <MEASURED_J2_ENDSTOP_DEGREES>
# The PAROL table labels 145.0088 as the negative-direction limit.  Its
# coordinate is -145.0088: the documented -90 degree standby pose must lie
# inside the configured numeric interval.
position_min: -145.0088
position_max: -3.375

[stepper_z] # J3: 18.0952381:1 -> 19.894736817 degrees / motor revolution
step_pin: <J3_STEP_PIN>
dir_pin: <J3_DIR_PIN>
enable_pin: <J3_ENABLE_PIN>
microsteps: 32
full_steps_per_rotation: 200
rotation_distance: 19.894736817174515
endstop_pin: <J3_ENDSTOP_PIN>
position_endstop: <MEASURED_J3_ENDSTOP_DEGREES>
position_min: 107.866
position_max: 287.8675

[stepper_a] # J4: 4:1 -> 90 degrees / motor revolution
step_pin: <J4_STEP_PIN>
dir_pin: <J4_DIR_PIN>
enable_pin: <J4_ENABLE_PIN>
microsteps: 32
full_steps_per_rotation: 200
rotation_distance: 90
endstop_pin: <J4_ENDSTOP_PIN>
position_endstop: <MEASURED_J4_ENDSTOP_DEGREES>
position_min: -105.46975
position_max: 105.46975

[stepper_b] # J5: 4:1 -> 90 degrees / motor revolution
step_pin: <J5_STEP_PIN>
dir_pin: <J5_DIR_PIN>
enable_pin: <J5_ENABLE_PIN>
microsteps: 32
full_steps_per_rotation: 200
rotation_distance: 90
endstop_pin: <J5_ENDSTOP_PIN>
position_endstop: <MEASURED_J5_ENDSTOP_DEGREES>
position_min: -90
position_max: 90

[stepper_c] # J6: 10:1 -> 36 degrees / motor revolution
step_pin: <J6_STEP_PIN>
dir_pin: <J6_DIR_PIN>
enable_pin: <J6_ENABLE_PIN>
microsteps: 32
full_steps_per_rotation: 200
rotation_distance: 36
endstop_pin: <J6_ENDSTOP_PIN>
position_endstop: <MEASURED_J6_ENDSTOP_DEGREES>
position_min: 0
position_max: 360

[printer]
kinematics: parol
# Units are degrees/s and degrees/s^2. Start much lower than these values.
max_velocity: 20
max_accel: 50
# Required by Klipper's six-axis toolhead; Z means J3 in this configuration.
max_z_velocity: 10
max_z_accel: 25
# J6 position used after J6 homes and before J5 homes. Adjust for a custom
# gripper if 180 degrees does not clear the J5 switch.
j6_j5_homing_position: 180

# Cartesian endpoint IK. The FK/Jacobian/DLS solve is performed by Klipper's
# compiled chelper (kin_parol.c); this Python section only configures it.
# PAROL_MOVE takes TCP X/Y/Z in mm and fixed-frame
# Z-Y-X orientation RX/RY/RZ in degrees, for example:
#   PAROL_MOVE X250 Y0 Z250 RX180 RY0 RZ0 VELOCITY=10
# The offset is the extra displacement from the standard PAROL gripper/flange
# frame to the extruder's actual tool center point, expressed in that frame.
[parol_ik]
tool_offset_x: 0
tool_offset_y: 0
tool_offset_z: 0
