name: Fully Automatic Klipper Sync & Copilot Fix

on:
  schedule:
    - cron: '0 0 * * 1' 
  workflow_dispatch:
jobs:
  auto-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      copilot-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Pull Latest Upstream Klipper Changes
        run: |
          git remote add upstream https://github.com/Klipper3d/klipper.git
          git fetch upstream
          git checkout main
          git merge upstream/master --allow-unrelated-histories || echo "Merge attempt completed"

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node.js (Required for Copilot CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Validation / Tests
        id: run_tests
        continue-on-error: true
        run: |
          # Replace with your actual test command. Saving output to a log file.
          python -m compileall . > test_output.log 2>&1

      - name: Install GitHub Copilot CLI
        if: steps.run_tests.outcome == 'failure'
        run: npm install -g @github/copilot

      - name: Fix Code with GitHub Copilot CLI
        if: steps.run_tests.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Tests failed. Invoking GitHub Copilot to analyze and fix the errors..."
          
          # Configure environment for headless execution
          export XDG_CONFIG_HOME="$RUNNER_TEMP/xdg-config"
          mkdir -p "$XDG_CONFIG_HOME"

          # Pass the failure log to Copilot CLI to fix the codebase non-interactively
          copilot -p "The test suite or compilation failed with the following errors: $(cat test_output.log). Please fix the code issues directly in the workspace." \
            --allow-all-tools \
            --allow-all-paths \
            --yes

      - name: Push Updates Automatically
        run: |
          git add -A
          git commit -m "fix(ai): automatically resolved upstream sync issues using GitHub Copilot" || echo "No changes to commit"
          git push origin main
